<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GoogleShot — Options</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafd;
        --fg: #1f1f1f;
        --muted: #5f6368;
        --border: #e0e3e7;
        --card: #ffffff;
        --accent: #1a73e8;
        --accent-soft: #e8f0fe;
        --accent-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1f20;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --border: #444746;
          --card: #282a2c;
          --accent: #8ab4f8;
          --accent-soft: #2d3b52;
          --accent-fg: #1f1f1f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .layout {
        max-width: 1040px;
        margin: 0 auto;
        padding: 32px 20px 80px;
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 32px;
        align-items: start;
      }
      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .sidebar {
          position: static !important;
          display: flex;
          gap: 8px;
          overflow-x: auto;
          padding-bottom: 4px;
        }
        .sidebar a {
          white-space: nowrap;
        }
      }

      /* sidebar */
      .sidebar {
        position: sticky;
        top: 32px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }
      .brand img {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }
      .brand-name {
        font-size: 16px;
        font-weight: 600;
      }
      .brand-version {
        font-size: 11px;
        color: var(--muted);
        margin: 0 0 16px 38px;
      }
      .sidebar a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .sidebar a:hover {
        background: var(--card);
        color: var(--fg);
      }
      .sidebar a.active {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .sidebar a .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.5;
      }
      .sidebar a.active .dot {
        opacity: 1;
      }

      /* content */
      main {
        min-width: 0;
      }
      section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 22px;
        margin-bottom: 18px;
        scroll-margin-top: 24px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .desc {
        color: var(--muted);
        font-size: 12.5px;
        margin: 0 0 18px;
      }
      .row {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }
      @media (max-width: 560px) {
        .row {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
      select,
      input[type="text"] {
        width: 100%;
        max-width: 340px;
        font: inherit;
        font-size: 13px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
      }
      .check {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
      }
      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
        padding: 12px 0;
      }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        border: 0;
        border-radius: 9px;
        padding: 9px 16px;
        cursor: pointer;
        background: var(--accent);
        color: var(--accent-fg);
      }
      button.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--border);
        font-weight: 500;
      }
      .coffee {
        display: inline-block;
        background: #ffdd00;
        color: #000000;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        border-radius: 9px;
        padding: 9px 18px;
      }
      .coffee:hover {
        filter: brightness(1.05);
      }
      .saved {
        color: #1e8e3e;
        font-size: 12px;
        margin-left: 8px;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .saved.visible {
        opacity: 1;
      }
      @media (prefers-color-scheme: dark) {
        .saved {
          color: #81c995;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav class="sidebar" id="sidebar">
        <div class="brand">
          <img src="icons/icon-48.png" alt="" />
          <span class="brand-name">GoogleShot</span>
        </div>
        <p class="brand-version" id="versionLine"></p>
        <a href="#defaults" data-section="defaults"><span class="dot"></span><span id="navDefaults"></span></a>
        <a href="#gmail" data-section="gmail"><span class="dot"></span><span id="navGmail"></span></a>
        <a href="#history" data-section="history"><span class="dot"></span><span id="navHistory"></span></a>
        <a href="#support" data-section="support"><span class="dot"></span><span id="navSupport"></span></a>
      </nav>

      <main>
        <section id="defaults">
          <h2 id="defaultsTitle"></h2>
          <p class="desc" id="defaultsDesc"></p>

          <div class="row">
            <label for="site" id="defaultToolLabel"></label>
            <select id="site">
              <option value="auto" id="siteAuto"></option>
              <option value="docs" id="siteDocs"></option>
              <option value="gmail" id="siteGmail"></option>
            </select>
          </div>

          <div class="row">
            <label for="quality" id="qualityLabel"></label>
            <select id="quality">
              <option value="60">60</option>
              <option value="70">70</option>
              <option value="80">80</option>
              <option value="90">90</option>
              <option value="95">95</option>
            </select>
          </div>

          <div class="row">
            <label for="speed" id="speedLabel"></label>
            <select id="speed">
              <option value="fast" id="speedFast"></option>
              <option value="normal" id="speedNormal"></option>
              <option value="safe" id="speedSafe"></option>
            </select>
          </div>

          <label class="check"><input type="checkbox" id="imageFolder" /> <span id="imagesLabel"></span></label>
          <label class="check"><input type="checkbox" id="debug" /> <span id="debugLabel"></span></label>
        </section>

        <section id="gmail">
          <h2 id="gmailTitle"></h2>
          <p class="desc" id="gmailDesc"></p>

          <div class="row">
            <label for="gmailFormat" id="gmailFormatLabel"></label>
            <select id="gmailFormat">
              <option value="mbox">mbox</option>
              <option value="pdf">pdf</option>
              <option value="txt">txt</option>
              <option value="json">json</option>
              <option value="xml">xml</option>
              <option value="csv">csv</option>
              <option value="html">html</option>
            </select>
          </div>

          <div class="row">
            <label for="gmailLimit" id="gmailLimitLabel"></label>
            <input type="text" id="gmailLimit" autocomplete="off" spellcheck="false" />
          </div>

          <label class="check">
            <input type="checkbox" id="gmailAttachmentsOnly" /> <span id="gmailAttachmentsLabel"></span>
          </label>
        </section>

        <section id="history">
          <h2 id="historyTitle"></h2>
          <p class="desc" id="historyDesc"></p>
          <div id="historyContainer"></div>
          <button class="secondary" id="clearHistory" style="margin-top: 12px"></button>
        </section>

        <section id="support">
          <h2 id="supportTitle"></h2>
          <p class="desc" id="supportDesc"></p>
          <a class="coffee" id="supportButton" href="https://buymeacoffee.com/fexxdev" target="_blank" rel="noopener"></a>
        </section>
      </main>
    </div>
    <script src="options.js"></script>
  </body>
</html>
