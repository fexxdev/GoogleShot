<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GoogleShot</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        width: 300px;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fafd;
        color: #202124;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #202124;
          color: #e8eaed;
        }
        .card {
          background: #292a2d !important;
          border-color: #3c4043 !important;
        }
        button.secondary {
          background: transparent !important;
          color: #8ab4f8 !important;
          border-color: #5f6368 !important;
        }
        input,
        select {
          border-color: #5f6368 !important;
          background: transparent;
          color: inherit;
        }
      }
      .wrap {
        padding: 14px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .hint {
        color: #5f6368;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .card {
        background: #fff;
        border: 1px solid #dadce0;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .status {
        font-weight: 500;
        min-height: 18px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        background: #1a73e8;
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button.secondary {
        background: #fff;
        color: #1a73e8;
        border: 1px solid #dadce0;
        margin-top: 8px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: inherit;
      }
      select,
      input[type='text'] {
        font: inherit;
        font-size: 12px;
        padding: 2px 4px;
        border-radius: 6px;
        border: 1px solid #dadce0;
        background: transparent;
        color: inherit;
      }
      details {
        margin-top: 4px;
      }
      summary {
        cursor: pointer;
        font-size: 12px;
        color: #1a73e8;
        margin-bottom: 8px;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .field > span {
        flex: 0 0 92px;
      }
      .field > input,
      .field > select {
        flex: 1 1 auto;
        min-width: 0;
      }
      .unsupported {
        display: none;
        background: #fef7e0;
        border: 1px solid #f9d849;
        color: #7a5900;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
        font-size: 12px;
      }
      @media (prefers-color-scheme: dark) {
        .unsupported {
          background: #3f3212;
          border-color: #7a5900;
          color: #fdd663;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>GoogleShot</h1>
      <div class="hint" data-i18n="popupCaptureHint"></div>
      <div class="unsupported" id="unsupported" data-i18n="popupUnsupported"></div>
      <div class="card">
        <div class="status" id="status"></div>
      </div>
      <button id="capture" data-i18n="popupCapture"></button>
      <button class="secondary" id="open" data-i18n="popupOpenDocs"></button>
      <details id="advanced">
        <summary data-i18n="popupAdvanced"></summary>
        <div class="card">
          <div class="field">
            <span data-i18n="popupRange"></span>
            <input type="text" id="range" />
          </div>
          <div class="field">
            <span data-i18n="popupSpeed"></span>
            <select id="speed">
              <option value="fast" data-i18n="popupSpeedFast"></option>
              <option value="normal" data-i18n="popupSpeedNormal"></option>
              <option value="safe" data-i18n="popupSpeedSafe"></option>
            </select>
          </div>
          <div class="field">
            <span data-i18n="popupFilename"></span>
            <input type="text" id="filename" />
          </div>
          <div class="field">
            <span data-i18n="popupQuality"></span>
            <select id="quality">
              <option value="60">60</option>
              <option value="70">70</option>
              <option value="80">80</option>
              <option value="90">90</option>
              <option value="95">95</option>
            </select>
          </div>
          <label><input type="checkbox" id="images" /> <span data-i18n="popupSaveImages"></span></label>
        </div>
      </details>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
